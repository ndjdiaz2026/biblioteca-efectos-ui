<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K01 · Submenú contextual fuera de la cabecera</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#faf8f3;color:#282b27;font:14px/1.5 system-ui,sans-serif}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.2}h2{font-size:28px}h3{font-size:21px}a{color:inherit;text-underline-offset:4px}button,input,select{font:inherit}button{cursor:pointer}button,a,input,select,summary{touch-action:manipulation}:focus-visible{outline:3px solid #a63242;outline-offset:3px}button,.btn{display:inline-block;padding:9px 14px;border:1px solid #c8cabd;border-radius:4px;background:#fff;color:#282b27;text-decoration:none}button.active,button[aria-pressed=true],.solid{background:#28392f;color:#fff}.muted{color:#62665e;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.art{display:block;width:100%;height:100%;object-fit:cover}.tile{position:relative;min-height:160px;overflow:hidden;border-radius:5px;background:#28392f;color:#fff}.tile .art{position:absolute;inset:0;transition:transform .45s}.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,#13261fd9)}.tile .copy{position:absolute;bottom:12px;left:14px;right:14px;z-index:1}.tile:hover .art,.tile:focus-within .art{transform:scale(1.045)}label{display:block}input,select{width:100%;padding:10px;border:1px solid #c8cabd;background:white;border-radius:4px}.surface{background:white;padding:20px;border:1px solid #deddd5;border-radius:6px}.badge{display:inline-block;font-size:11px;padding:3px 8px;background:#f0e5ce;color:#483b1f;border-radius:20px}output{display:block;margin-top:14px}html{scroll-behavior:smooth}section{scroll-margin-top:70px}nav{display:flex;gap:8px;flex-wrap:wrap}svg{display:block}dialog{max-width:420px;width:calc(100% - 40px);border:0;border-radius:8px;padding:26px}dialog::backdrop{background:#0007}@media(max-width:420px){body{padding:16px}.grid{grid-template-columns:1fr 1fr}h2{font-size:25px}button,.btn{padding:8px 10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
.context{border-block:1px solid #d7d2c4;padding:15px 0;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.context h2{font-size:22px;margin:0}.context a{text-decoration:none;padding:5px 0;border-bottom:2px solid transparent;font-size:12px}.context a[aria-current=page]{border-color:#a63242}.view{padding:30px 0}.crumb{font-size:11px;color:#62665e}.company-logo{display:block;width:clamp(200px,32vw,320px);max-width:100%;height:auto;margin:0 0 28px}</style></head><body><p class="muted">Cabecera global → fuera de esta demostración</p><div class="context"><div><h2>Sobre nuestra agencia</h2><span class="crumb">Inicio / Nosotros / <span id="crumb">Por qué elegirnos</span></span></div><nav aria-label="Páginas de Nosotros"><a href="#por-que" aria-current="page">Por qué elegirnos</a><a href="#impacto">Impacto</a><a href="#equipo">Equipo</a><a href="#carreras">Carreras</a></nav></div><div class="view" id="view" aria-live="polite"><h2>Diseñamos alrededor de ti.</h2><p>Un proceso claro, atención personal y acompañamiento.</p></div><p class="muted">Selecciona una página del menú contextual.</p><script>const views={'#por-que':['Diseñamos alrededor de ti.','Un proceso claro, atención personal y acompañamiento.'],'#impacto':['Nuestro impacto.','Explica las acciones concretas y cómo se comprueban.'],'#equipo':['Personas detrás del viaje.','Presenta especialistas, experiencia y responsabilidades.'],'#carreras':['Crece con nosotros.','Muestra oportunidades reales y cómo postularse.']};function update(a){document.querySelectorAll('nav a').forEach(x=>{x.removeAttribute('aria-current');if(x===a)x.setAttribute('aria-current','page')});const v=views[a.getAttribute('href')];document.querySelector('#view').innerHTML='<h2>'+v[0]+'</h2><p>'+v[1]+'</p>';document.querySelector('#crumb').textContent=a.textContent}document.querySelectorAll('nav a').forEach(a=>a.onclick=e=>{e.preventDefault();update(a)});</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K03 · Beneficios como capítulos visuales</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#faf8f3;color:#282b27;font:14px/1.5 system-ui,sans-serif}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.2}h2{font-size:28px}h3{font-size:21px}a{color:inherit;text-underline-offset:4px}button,input,select{font:inherit}button{cursor:pointer}button,a,input,select,summary{touch-action:manipulation}:focus-visible{outline:3px solid #a63242;outline-offset:3px}button,.btn{display:inline-block;padding:9px 14px;border:1px solid #c8cabd;border-radius:4px;background:#fff;color:#282b27;text-decoration:none}button.active,button[aria-pressed=true],.solid{background:#28392f;color:#fff}.muted{color:#62665e;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.art{display:block;width:100%;height:100%;object-fit:cover}.tile{position:relative;min-height:160px;overflow:hidden;border-radius:5px;background:#28392f;color:#fff}.tile .art{position:absolute;inset:0;transition:transform .45s}.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,#13261fd9)}.tile .copy{position:absolute;bottom:12px;left:14px;right:14px;z-index:1}.tile:hover .art,.tile:focus-within .art{transform:scale(1.045)}label{display:block}input,select{width:100%;padding:10px;border:1px solid #c8cabd;background:white;border-radius:4px}.surface{background:white;padding:20px;border:1px solid #deddd5;border-radius:6px}.badge{display:inline-block;font-size:11px;padding:3px 8px;background:#f0e5ce;color:#483b1f;border-radius:20px}output{display:block;margin-top:14px}html{scroll-behavior:smooth}section{scroll-margin-top:70px}nav{display:flex;gap:8px;flex-wrap:wrap}svg{display:block}dialog{max-width:420px;width:calc(

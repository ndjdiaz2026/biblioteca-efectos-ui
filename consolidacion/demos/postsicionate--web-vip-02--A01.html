<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A01 · Experiencias agrupadas por la motivación del viaje</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:22px;background:#faf8f3;color:#282b27;font:14px/1.5 system-ui,sans-serif}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.2}h2{font-size:28px}h3{font-size:21px}a{color:inherit;text-underline-offset:4px}button,input,select{font:inherit}button{cursor:pointer}button,a,input,select,summary{touch-action:manipulation}:focus-visible{outline:3px solid #a63242;outline-offset:3px}button,.btn{display:inline-block;padding:9px 14px;border:1px solid #c8cabd;border-radius:4px;background:#fff;color:#282b27;text-decoration:none}button.active,button[aria-pressed=true],.solid{background:#28392f;color:#fff}.muted{color:#62665e;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.art{display:block;width:100%;height:100%;object-fit:cover}.tile{position:relative;min-height:160px;overflow:hidden;border-radius:5px;background:#28392f;color:#fff}.tile .art{position:absolute;inset:0;transition:transform .45s}.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,#13261fd9)}.tile .copy{position:absolute;bottom:12px;left:14px;right:14px;z-index:1}.tile:hover .art,.tile:focus-within .art{transform:scale(1.045)}label{display:block}input,select{width:100%;padding:10px;border:1px solid #c8cabd;background:white;border-radius:4px}.surface{background:white;padding:20px;border:1px solid #deddd5;border-radius:6px}.badge{display:inline-block;font-size:11px;padding:3px 8px;background:#f0e5ce;color:#483b1f;border-radius:20px}output{display:block;margin-top:14px}html{scroll-behavior:smooth}section{scroll-margin-top:70px}nav{display:flex;gap:8px;flex-wrap:wrap}svg{display:block}dialog{max-width:420px;width:calc(100% - 40px);border:0;border-radius:8px;padding:26px}dialog::backdrop{background:#0007}@media(max-width:420px){body{padding:16px}.grid{grid-template-columns:1fr 1fr}h2{font-size:25px}button,.btn{padding:8px 10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
.rail{display:flex;gap:12px;overflow:auto;scroll-snap-type:x mandatory;padding:8px 0 16px}.experience{flex:0 0 80%;scroll-snap-align:start;background:white;border:1px solid #ddd;border-radius:6px;overflow:hidden}.experience .image{height:140px}.experience .info{padding:16px}.experience h3{margin-bottom:8px}.company-logo{display:block;width:clamp(200px,32vw,320px);max-width:100%;height:auto;margin:0 0 28px}</style></head><body><h2>Elige la razón para viajar.</h2><div class="rail" id="rail" tabindex="0" aria-label="Colección de experiencias"><article class="experience"><div class="image"><svg class="art" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="600" height="360" fill="#9cbfb3"/><circle cx="452" cy="90" r="36" fill="#ebdba9"/><path d="M0 230 140 62 300 246 436 110 600 240V360H0Z" fill="#53796c"/><path d="M0 288 170 169 322 303 488 218 600 264V360H0Z" fill="#244637"/><path d="M0 316Q180 286 310 327T600 317V360H0Z" fill="#9cbfb3" opacity=".6"/><path d="M0 345Q190 312 370 345T600 339" fill="none" stroke="#ebdba9" opacity=".45" stroke-width="3"/></svg></div><div class="info"><h3>Compartir en familia</h3><p>Un ritmo flexible para distintas edades.</p><button data-i="0">Explorar colección</button></div></article><article class="experience"><div class="image"><svg class="art" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="600" height="360" fill="#bdd5e0"/><circle cx="452" cy="90" r="36" fill="#e8e1c6"/><path d="M0 230 140 62 300 246 436 110 600 240V360H0Z" fill="#718da7"/><path d="M0 288 170 169 322 303 488 218 600 264V360H0Z" fill="#375567"/><path d="M0 316Q180 286 310 327T600 317V360H0Z" fill="#bdd5e0" opacity=".6"/><path d="M0 345Q190 312 370 345T600 339" fill="none" stroke="#e8e1c6" opacity=".45" stroke-width="3"/></svg></div><div class="info"><h3>Conectar con naturaleza</h3><p>Tiempo para observar y conocer el entorno.</p><button data-i="1">Explorar colección</button></div></article><article class="experience"><div class="image"><svg class="art" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="600" height="360" fill="#e5bc95"/><circle cx="452" cy="90" r="36" fill="#f5e4b5"/><path d="M0 230 140 62 300 246 436 110 600 240V360H0Z" fill="#b98164"/><path d="M0 288 170 169 322 303 488 218 600 264V360H0Z" fill="#6d6455"/><path d="M0 316Q180 286 310 327T600 317V360H0Z" fill="#e5bc95" opacity=".6"/><path d="M0 345Q190 312 370 345T600 339" fill="none" stroke="#f5e4b5" opacity=".45" stroke-width="3"/></svg></div><div class="info"><h3>Explorar y descansar</h3><p>Alternar actividad y días de pausa.</p><button data-i="2">Explorar colección</button></div></article></div><div class="row"><button id="prev" aria-label="Colección anterior">←</button><button id="next" aria-label="Colección siguiente">→</button></div><output id="result" aria-live="polite"></output><script>const r=document.querySelector('#rail');document.querySelector('#prev').onclick=()=>r.scrollBy({left:-r.clientWidth*.85,behavior:'smooth'});document.querySelector('#next').onclick=()=>r.scrollBy({left:r.clientWidth*.85,behavior:'smooth'});document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>document.querySelector('#result').textContent='Colección de muestra elegida: '+b.closest('article').querySelector('h3').textContent);</script></body></html>

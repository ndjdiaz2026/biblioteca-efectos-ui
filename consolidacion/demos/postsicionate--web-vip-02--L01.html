<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L01 · Búsqueda con destino y fecha desde la portada</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:22px;background:#faf8f3;color:#282b27;font:14px/1.5 system-ui,sans-serif}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.2}h2{font-size:28px}h3{font-size:21px}a{color:inherit;text-underline-offset:4px}button,input,select{font:inherit}button{cursor:pointer}button,a,input,select,summary{touch-action:manipulation}:focus-visible{outline:3px solid #a63242;outline-offset:3px}button,.btn{display:inline-block;padding:9px 14px;border:1px solid #c8cabd;border-radius:4px;background:#fff;color:#282b27;text-decoration:none}button.active,button[aria-pressed=true],.solid{background:#28392f;color:#fff}.muted{color:#62665e;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.art{display:block;width:100%;height:100%;object-fit:cover}.tile{position:relative;min-height:160px;overflow:hidden;border-radius:5px;background:#28392f;color:#fff}.tile .art{position:absolute;inset:0;transition:transform .45s}.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,#13261fd9)}.tile .copy{position:absolute;bottom:12px;left:14px;right:14px;z-index:1}.tile:hover .art,.tile:focus-within .art{transform:scale(1.045)}label{display:block}input,select{width:100%;padding:10px;border:1px solid #c8cabd;background:white;border-radius:4px}.surface{background:white;padding:20px;border:1px solid #deddd5;border-radius:6px}.badge{display:inline-block;font-size:11px;padding:3px 8px;background:#f0e5ce;color:#483b1f;border-radius:20px}output{display:block;margin-top:14px}html{scroll-behavior:smooth}section{scroll-margin-top:70px}nav{display:flex;gap:8px;flex-wrap:wrap}svg{display:block}dialog{max-width:420px;width:calc(100% - 40px);border:0;border-radius:8px;padding:26px}dialog::backdrop{background:#0007}@media(max-width:420px){body{padding:16px}.grid{grid-template-columns:1fr 1fr}h2{font-size:25px}button,.btn{padding:8px 10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
.search-form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.result-card{margin-top:18px;background:white;padding:18px;border:1px solid #ddd}.result-card h3{margin-bottom:8px}@media(max-width:500px){.search-form{grid-template-columns:1fr}.search-form button{width:100%}}.company-logo{display:block;width:clamp(200px,32vw,320px);max-width:100%;height:auto;margin:0 0 28px}</style></head><body><h2>Encuentra una opción que encaje.</h2><form id="form" class="search-form"><label for="where">Destino<select id="where"><option value="all">Cualquier destino</option><option value="norte">Norte</option><option value="costa">Costa</option><option value="bosque">Bosque</option></select></label><label for="when">Cuándo<select id="when"><option value="all">Cualquier periodo</option><option value="inicio">Inicio de año</option><option value="mitad">Mitad de año</option><option value="final">Final de año</option></select></label><button class="solid">Buscar</button></form><div id="results" aria-live="polite"></div><p class="muted">Ofertas ficticias. Las fechas sólo filtran datos de demostración.</p><script>const offers=[{name:'Horizontes del norte',where:'norte',when:'inicio'},{name:'Pausa en la costa',where:'costa',when:'mitad'},{name:'Senderos del bosque',where:'bosque',when:'final'}];document.querySelector('#form').onsubmit=e=>{e.preventDefault();const w=document.querySelector('#where').value,t=document.querySelector('#when').value,r=offers.filter(x=>(w==='all'||x.where===w)&&(t==='all'||x.when===t));document.querySelector('#results').innerHTML=r.length?r.map(x=>'<div class="result-card"><h3>'+x.name+'</h3><span class="muted">Opción de muestra · Ajustar duración y participantes.</span></div>').join(''):'<div class="result-card">Sin coincidencias. Prueba otro periodo o cualquier destino.</div>'};</script></body></html>

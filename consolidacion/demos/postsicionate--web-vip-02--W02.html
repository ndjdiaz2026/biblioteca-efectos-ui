<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W02 · La logística convertida en una ruta visual</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:22px;background:#faf8f3;color:#282b27;font:14px/1.5 system-ui,sans-serif}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.2}h2{font-size:28px}h3{font-size:21px}a{color:inherit;text-underline-offset:4px}button,input,select{font:inherit}button{cursor:pointer}button,a,input,select,summary{touch-action:manipulation}:focus-visible{outline:3px solid #a63242;outline-offset:3px}button,.btn{display:inline-block;padding:9px 14px;border:1px solid #c8cabd;border-radius:4px;background:#fff;color:#282b27;text-decoration:none}button.active,button[aria-pressed=true],.solid{background:#28392f;color:#fff}.muted{color:#62665e;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.art{display:block;width:100%;height:100%;object-fit:cover}.tile{position:relative;min-height:160px;overflow:hidden;border-radius:5px;background:#28392f;color:#fff}.tile .art{position:absolute;inset:0;transition:transform .45s}.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,#13261fd9)}.tile .copy{position:absolute;bottom:12px;left:14px;right:14px;z-index:1}.tile:hover .art,.tile:focus-within .art{transform:scale(1.045)}label{display:block}input,select{width:100%;padding:10px;border:1px solid #c8cabd;background:white;border-radius:4px}.surface{background:white;padding:20px;border:1px solid #deddd5;border-radius:6px}.badge{display:inline-block;font-size:11px;padding:3px 8px;background:#f0e5ce;color:#483b1f;border-radius:20px}output{display:block;margin-top:14px}html{scroll-behavior:smooth}section{scroll-margin-top:70px}nav{display:flex;gap:8px;flex-wrap:wrap}svg{display:block}dialog{max-width:420px;width:calc(100% - 40px);border:0;border-radius:8px;padding:26px}dialog::backdrop{background:#0007}@media(max-width:420px){body{padding:16px}.grid{grid-template-columns:1fr 1fr}h2{font-size:25px}button,.btn{padding:8px 10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
.route{background:#e6eef0;border-radius:8px;padding:20px}.route svg{width:100%;height:120px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.facts strong{display:block;font:22px Georgia}.facts span{font-size:11px}.route output{font-size:13px}.company-logo{display:block;width:clamp(200px,32vw,320px);max-width:100%;height:auto;margin:0 0 28px}</style></head><body><div class="route"><span class="badge">Ruta ficticia · esquema sin escala</span><h2 style="margin-top:14px">De la puerta de salida al paisaje.</h2><svg viewBox="0 0 480 130" role="img" aria-label="Esquema de una ruta entre ciudad de salida y campamento"><path d="M45 90 Q240 -40 435 90" fill="none" stroke="#536f7b" stroke-width="2" stroke-dasharray="6 6"/><circle cx="45" cy="90" r="7" fill="#28392f"/><circle cx="435" cy="90" r="7" fill="#a63242"/><text x="15" y="120" font-size="14">Salida</text><text x="360" y="120" font-size="14">Campamento</text></svg><div class="facts"><div><strong>2 etapas</strong><span>Recorrido de muestra</span></div><div><strong>Flexible</strong><span>Según condiciones</span></div><div><strong>Un equipo</strong><span>Coordinación</span></div></div><button id="details" style="margin-top:18px" aria-expanded="false" aria-controls="result">Ver coordinación</button><output id="result" hidden>Ejemplo: verificar conexión, equipaje, punto de encuentro y plan alternativo antes del traslado.</output></div><script>const b=document.querySelector('#details'),o=document.querySelector('#result');b.onclick=()=>{o.hidden=!o.hidden;b.setAttribute('aria-expanded',String(!o.hidden))};</script></body></html>

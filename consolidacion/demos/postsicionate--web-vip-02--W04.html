<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W04 · El proceso de compra explicado por etapas</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:22px;background:#faf8f3;color:#282b27;font:14px/1.5 system-ui,sans-serif}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.2}h2{font-size:28px}h3{font-size:21px}a{color:inherit;text-underline-offset:4px}button,input,select{font:inherit}button{cursor:pointer}button,a,input,select,summary{touch-action:manipulation}:focus-visible{outline:3px solid #a63242;outline-offset:3px}button,.btn{display:inline-block;padding:9px 14px;border:1px solid #c8cabd;border-radius:4px;background:#fff;color:#282b27;text-decoration:none}button.active,button[aria-pressed=true],.solid{background:#28392f;color:#fff}.muted{color:#62665e;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.art{display:block;width:100%;height:100%;object-fit:cover}.tile{position:relative;min-height:160px;overflow:hidden;border-radius:5px;background:#28392f;color:#fff}.tile .art{position:absolute;inset:0;transition:transform .45s}.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,#13261fd9)}.tile .copy{position:absolute;bottom:12px;left:14px;right:14px;z-index:1}.tile:hover .art,.tile:focus-within .art{transform:scale(1.045)}label{display:block}input,select{width:100%;padding:10px;border:1px solid #c8cabd;background:white;border-radius:4px}.surface{background:white;padding:20px;border:1px solid #deddd5;border-radius:6px}.badge{display:inline-block;font-size:11px;padding:3px 8px;background:#f0e5ce;color:#483b1f;border-radius:20px}output{display:block;margin-top:14px}html{scroll-behavior:smooth}section{scroll-margin-top:70px}nav{display:flex;gap:8px;flex-wrap:wrap}svg{display:block}dialog{max-width:420px;width:calc(100% - 40px);border:0;border-radius:8px;padding:26px}dialog::backdrop{background:#0007}@media(max-width:420px){body{padding:16px}.grid{grid-template-columns:1fr 1fr}h2{font-size:25px}button,.btn{padding:8px 10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
.steps{display:flex;gap:6px;flex-wrap:wrap}.steps button{border-radius:50%;width:36px;height:36px;padding:0}.step-content{margin-top:20px;min-height:150px}.progress{height:4px;background:#ddd;margin:18px 0}.progress span{display:block;background:#28392f;height:100%;transition:width .3s}.company-logo{display:block;width:clamp(200px,32vw,320px);max-width:100%;height:auto;margin:0 0 28px}</style></head><body><h2>Antes de empezar, conoce el camino.</h2><div id="steps" class="steps" aria-label="Etapas del proceso"></div><div class="progress" aria-hidden="true"><span id="bar"></span></div><div id="content" class="surface step-content" aria-live="polite"></div><div class="row" style="margin-top:14px"><button id="prev">Anterior</button><button id="next" class="solid">Siguiente</button></div><script>const steps=[['Conversar','Definir objetivo, preferencias y alcance.'],['Confirmar','Revisar propuesta, condiciones y responsabilidades.'],['Planificar','Coordinar fechas, servicios y documentación aplicable.'],['Preparar','Resolver dudas y entregar la información acordada.'],['Comenzar','Confirmar el punto de encuentro y el canal de asistencia.']];let i=0;const nav=document.querySelector('#steps');nav.innerHTML=steps.map((s,n)=>'<button data-i="'+n+'" aria-label="Etapa '+(n+1)+': '+s[0]+'">'+(n+1)+'</button>').join('');function show(){document.querySelector('#content').innerHTML='<span class="muted">Etapa '+(i+1)+' de '+steps.length+'</span><h3>'+steps[i][0]+'</h3><p>'+steps[i][1]+'</p>';document.querySelector('#bar').style.width=((i+1)/steps.length*100)+'%';nav.querySelectorAll('button').forEach((b,n)=>{b.setAttribute('aria-pressed',String(n===i))});document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===steps.length-1}nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{i=Number(b.dataset.i);show()});document.querySelector('#prev').onclick=()=>{i--;show()};document.querySelector('#next').onclick=()=>{i++;show()};show();</script></body></html>
